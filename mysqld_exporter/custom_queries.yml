- name: mariadb_query_write_pressure
  type: gauge
  help: Approximate write pressure per query digest
  key_labels:
    - digest
    - query
  values:
    - write_load
  query: |
    SELECT 
      DIGEST AS digest,
      DIGEST_TEXT AS query,
      SUM_ROWS_INSERTED + SUM_ROWS_UPDATED + SUM_ROWS_DELETED AS write_load
    FROM performance_schema.events_statements_summary_by_digest
    ORDER BY write_load DESC
    LIMIT 20
