global:
  scrape_interval: 15s
  external_labels:
    cluster: "local"
    prometheus: "prometheus"

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['10.0.1.6:9100']

  - job_name: 'smartctl'
    static_configs:
      - targets: ['smartctl_exporter:9902']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'prometheus_exporter'
    static_configs:
      - targets: ['10.0.1.6:9101']

  - job_name: 'apcupsd_exporter'
    static_configs:
      - targets: ['10.0.1.6:9162']

  - job_name: 'remote_backup_node'
    static_configs:
      - targets: ['10.8.0.102:9100']

  - job_name: 'mysql'
    static_configs:
      - targets: ['10.0.1.6:9104']

  - job_name: 'mosquitto'
    static_configs:
      - targets: ['mosquitto_exporter:9234']

  - job_name: 'snmp'
    scrape_interval: 30s
    metrics_path: /snmp
    static_configs:
      - targets: ['snmp_exporter:9116']
    params:
      module: [if_mib]
